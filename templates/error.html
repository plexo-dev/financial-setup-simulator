{% extends "layout.html" %}

{% block title %}
    Simulation Error
{% endblock %}

{% block main %}
    <div class="error-panel">
        <p class="fs-1 mb-3">Simulation could not run</p>
        <p class="text-muted mb-4">Check your symbol, period/interval pair, and algorithm code, then try again.</p>
        <div class="alert alert-danger" role="alert">
            <pre class="error-message mb-0">{{ message }}</pre>
        </div>
        <a href="/" class="btn btn-outline-secondary mt-4">Back to setup</a>
    </div>
{% endblock %}
